<title>To Buy or Not</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one narrow column, one question per card, verdict as a full-colour card. */
:root {
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #1b1f1c;
  --muted: #646b66;
  --line: #dfe4df;
  --accent: #2f5d50;
  --accent-ink: #ffffff;
  --buy: #2f7a4f;  --buy-bg: #e3f2e8;
  --dont: #b0413e; --dont-bg: #f8e6e5;
  --wait: #93660f; --wait-bg: #fbefd6;
  --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141715; --card: #1d211e; --ink: #e9ece9; --muted: #98a09a; --line: #2f3531;
    --accent: #7fb8a4; --accent-ink: #0f1f1a;
    --buy: #79c99a; --buy-bg: #1b2d22; --dont: #e58a86; --dont-bg: #34201f; --wait: #e2b860; --wait-bg: #322819;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141715; --card: #1d211e; --ink: #e9ece9; --muted: #98a09a; --line: #2f3531;
  --accent: #7fb8a4; --accent-ink: #0f1f1a;
  --buy: #79c99a; --buy-bg: #1b2d22; --dont: #e58a86; --dont-bg: #34201f; --wait: #e2b860; --wait-bg: #322819;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font: 700 23px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
.sync { font-size: 12px; color: var(--muted); display: block; margin-top: 3px; font-family: var(--body); font-weight: 400; }
nav { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
nav button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
nav button.on { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.q { font: 600 21px/1.25 var(--display); margin: 4px 0 18px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
input[type=text], input[type=number], select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font: inherit;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.link { border: 0; background: none; color: var(--muted); padding: 6px 0; }
.btn.danger { color: var(--dont); border-color: var(--dont); }
.choices { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.choices .btn { padding: 16px; font-size: 16px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.verdict { text-align: center; padding: 30px 22px; border-color: transparent; }
.verdict .big { font: 700 38px/1.1 var(--display); letter-spacing: -0.02em; margin: 6px 0 8px; }
.verdict.buy { background: var(--buy-bg); } .verdict.buy .big { color: var(--buy); }
.verdict.dont { background: var(--dont-bg); } .verdict.dont .big { color: var(--dont); }
.verdict.wait { background: var(--wait-bg); } .verdict.wait .big { color: var(--wait); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat b { display: block; font: 700 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.entry { padding: 14px 0; border-top: 1px solid var(--line); }
.entry:first-child, .sub + .entry { border-top: 0; padding-top: 0; }
.sub + .entry { padding-top: 10px; }
.entry .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.entry .name { font-weight: 600; word-break: break-word; min-width: 0; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.tag.buy { color: var(--buy); background: var(--buy-bg); }
.tag.dont { color: var(--dont); background: var(--dont-bg); }
.tag.wait { color: var(--wait); background: var(--wait-bg); }
.meta { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.path { font-size: 13px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
.entry .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.due { border-color: var(--wait); margin-bottom: 14px; }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }
.filters { display: flex; gap: 8px; margin-bottom: 14px; }
.filters input { flex: 1; min-width: 0; padding: 9px 12px; }
.filters select { width: auto; padding: 9px 12px; }
.invoice { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
.invoice a { color: var(--accent); word-break: break-all; }
.thumb { display: block; max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; }
footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
footer .btn { font-size: 12px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  max-width: calc(100% - 32px); z-index: 20;
}
</style>

<div class="wrap">
  <header>
    <h1>To buy or not?<span class="sync" id="sync">Saved on this device</span></h1>
    <nav>
      <button data-tab="decide" class="on">Decide</button>
      <button data-tab="history">History</button>
    </nav>
  </header>

  <section id="decide">
    <div id="dueBox"></div>
    <div id="flow"></div>
  </section>

  <section id="history" hidden>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <input type="text" id="search" placeholder="Search items" aria-label="Search items">
      <select id="filter" aria-label="Filter by verdict">
        <option value="">All</option>
        <option value="buy">Buy</option>
        <option value="dont">Don't buy</option>
        <option value="wait">Waiting</option>
      </select>
    </div>
    <div class="card" id="list"></div>
    <footer><button class="btn link" id="exportBtn" hidden>Export history (JSON)</button></footer>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" hidden accept="image/*,application/pdf">

<script>
// ================= Storage =================
// Synced: claude.ai db (private to you, under data/users/<id>/entries) + assets for invoices.
// Fallback: localStorage + IndexedDB when the page is opened outside claude.ai.
const KEY = 'tbon.entries.v1';
const lsGet = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const lsSet = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
let entries = lsGet();
let col = null, assets = null, downloads = null;

function persist(e) {
  lsSet(entries);
  if (col) col.doc(e.id).set(JSON.parse(JSON.stringify(e))).catch(err => toast('Could not sync: ' + (err.message || err.code)));
}
function removeEntry(e) {
  entries = entries.filter(x => x.id !== e.id); lsSet(entries);
  if (col) col.doc(e.id).delete().catch(() => {});
}

// IndexedDB fallback for invoices
const idb = (() => { try { return new Promise((res, rej) => {
  const r = indexedDB.open('tbon', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('invoices');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}); } catch { return Promise.reject(); } })();
idb.catch(() => {});
async function idbDo(mode, fn) {
  const db = await idb;
  return new Promise((res, rej) => {
    const tx = db.transaction('invoices', mode); const req = fn(tx.objectStore('invoices'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}

async function connect() {
  if (!window.claude || !claude.use) return;
  const [db, user, a, d] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => claude.use(n).catch(() => null)));
  assets = a; downloads = d;
  if (downloads) $('#exportBtn').hidden = false;
  if (!db || !user) return;
  const uidv = await user.id().catch(() => null);
  if (!uidv) return;
  col = db.collection('data/users/' + uidv + '/entries');
  $('#sync').textContent = 'Syncing…';
  let first = true;
  const timer = setTimeout(() => { if (first) $('#sync').textContent = 'Offline — saved on this device'; }, 10000);
  col.onSnapshot(snap => {
    clearTimeout(timer);
    const remote = snap.docs.map(s => s.data()).filter(Boolean);
    if (first) {
      first = false;
      // Push up anything that only exists locally (e.g. made before syncing was available)
      const ids = new Set(remote.map(x => x.id));
      entries.filter(x => !ids.has(x.id) && !x.invoice?.local).forEach(x => { col.doc(x.id).set(x).catch(() => {}); remote.push(x); });
    }
    entries = remote.sort((x, y) => y.createdAt - x.createdAt);
    lsSet(entries);
    $('#sync').textContent = 'Synced across your devices';
    renderDue(); if (!$('#history').hidden) renderHistory();
  }, () => { clearTimeout(timer); $('#sync').textContent = 'Sync unavailable — saved on this device'; col = null; });
}

// ================= Decision tree (from the sketch) =================
const TREE = {
  have: { q: 'Do you already have something that does the job?', opts: [['Yes', 'broken'], ['No', 'importance']] },
  broken: { q: 'Is it broken or malfunctioning?',
    opts: [['Yes', 'push'], ['No', { v: 'dont', why: 'What you have still does the job.' }]] },
  push: { q: 'Can you push it for some time?', opts: [['Yes', 'pushDays'], ['No', 'money']] },
  pushDays: { q: 'How long can you push it?', input: 'days' },
  importance: { q: 'How important is it that you have it?',
    opts: [['Essential', 'money'], ['Can wait', { v: 'dont', why: 'It can wait, so let it wait.' }]] },
  money: { q: 'Do you have the money to buy it?',
    opts: [['Yes', { v: 'buy', why: 'You need it and you can afford it.' }], ['No', 'borrow']] },
  borrow: { q: 'Can you borrow the money, and do you want to?',
    opts: [['Yes', { v: 'buy', why: 'You need it and you’re okay borrowing for it.' }],
           ['No', { v: 'dont', why: 'Not right now. Check back in 7 days.', days: 7 }]] },
};
const LABEL = { buy: 'Buy', dont: "Don't buy", wait: 'Wait' };
let state = null;

// ================= Helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const CUR = (() => { try { const r = new Intl.Locale(navigator.language).maximize().region;
  return ({ IN: 'INR', GB: 'GBP', US: 'USD', CA: 'CAD', AU: 'AUD', JP: 'JPY', CH: 'CHF', SG: 'SGD', AE: 'AED', NZ: 'NZD' })[r] ||
    (['DE','FR','ES','IT','NL','IE','PT','BE','AT','FI','GR'].includes(r) ? 'EUR' : 'USD'); } catch { return 'USD'; } })();
const money = n => n == null || n === '' ? '' : Number(n).toLocaleString(undefined, { style: 'currency', currency: CUR, maximumFractionDigits: 2 });
const DAY = 864e5;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }

// ================= Decide flow =================
function renderStart(prefill = '', price = '', recheckOf = null) {
  state = null;
  $('#flow').innerHTML = `
    <form class="card" id="startForm">
      <p class="sub">Before you hit checkout…</p>
      <div class="q">What do you want to buy?</div>
      <input type="text" id="item" placeholder="e.g. New headphones" value="${esc(prefill)}" required autocomplete="off">
      <label class="f" for="price">Price (optional, adds up what you didn’t spend)</label>
      <input type="number" id="price" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${esc(price)}">
      <div style="margin-top:18px"><button class="btn primary" style="width:100%">Start</button></div>
    </form>`;
  $('#startForm').onsubmit = e => {
    e.preventDefault();
    const item = $('#item').value.trim(); if (!item) return;
    const p = $('#price').value;
    state = { item, price: p === '' ? null : Number(p), node: 'have', path: [], history: [], recheckOf };
    renderNode();
  };
}

const trailHTML = () => `<div class="trail"><span class="chip"><b>${esc(state.item)}</b>${state.price != null ? ' · ' + money(state.price) : ''}</span>
  ${state.path.map(p => `<span class="chip">${esc(p.a)}</span>`).join('')}</div>`;

function renderNode() {
  const n = TREE[state.node];
  const body = n.input === 'days'
    ? `<form id="daysForm">
        <div style="display:flex;gap:10px;align-items:center">
          <input type="number" id="days" min="1" max="365" value="14" required inputmode="numeric" style="flex:1">
          <span style="color:var(--muted)">days</span>
        </div>
        <div style="margin-top:14px"><button class="btn primary" style="width:100%">Set reminder</button></div>
      </form>`
    : `<div class="choices">${n.opts.map((o, i) => `<button class="btn" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
  $('#flow').innerHTML = `<div class="card">${trailHTML()}<div class="q">${esc(n.q)}</div>${body}
    <div style="margin-top:12px"><button class="btn link" id="back">← Back</button></div></div>`;
  $('#back').onclick = () => {
    if (!state.history.length) return renderStart(state.item, state.price ?? '', state.recheckOf);
    state.node = state.history.pop(); state.path.pop(); renderNode();
  };
  if (n.input === 'days') {
    $('#daysForm').onsubmit = e => {
      e.preventDefault();
      const d = Math.max(1, Math.round(Number($('#days').value)));
      state.path.push({ q: n.q, a: `${d} days` });
      finish({ v: 'wait', why: `Push it for ${d} days, then check again.`, days: d });
    };
  } else {
    $('#flow').querySelectorAll('.choices .btn').forEach(b => b.onclick = () => {
      const [label, next] = n.opts[b.dataset.i];
      state.path.push({ q: n.q, a: label });
      if (typeof next === 'string') { state.history.push(state.node); state.node = next; renderNode(); }
      else finish(next);
    });
  }
}

function finish(out) {
  const now = Date.now();
  const e = { id: uid(), item: state.item, price: state.price, createdAt: now, path: state.path,
    verdict: out.v, why: out.why, remindAt: out.days ? now + out.days * DAY : null,
    reminderDone: false, recheckOf: state.recheckOf || null, invoice: null };
  if (state.recheckOf) { const old = entries.find(x => x.id === state.recheckOf); if (old) { old.reminderDone = true; persist(old); } }
  entries.unshift(e); persist(e);
  renderVerdict(e); renderDue();
}

function calUrl(e) {
  const ymd = t => new Date(t).toISOString().slice(0, 10).replace(/-/g, '');
  const p = new URLSearchParams({ action: 'TEMPLATE', text: `Re-check: do I still want ${e.item}?`,
    dates: `${ymd(e.remindAt)}/${ymd(e.remindAt + DAY)}`, details: e.why + '\nOpen To Buy or Not and tap Re-check.' });
  return 'https://calendar.google.com/calendar/render?' + p;
}

function renderVerdict(e) {
  $('#flow').innerHTML = `<div class="card verdict ${e.verdict}">
    <div class="sub">${esc(e.item)}</div>
    <div class="big">${e.verdict === 'wait' ? 'Not yet' : LABEL[e.verdict]}</div>
    <div>${esc(e.why)}</div>
    ${e.remindAt ? `<p class="meta">Check-in on ${fmtDate(e.remindAt)}. It will show at the top of this screen.</p>` : ''}
    <div class="actions">
      ${e.verdict === 'buy' ? `<button class="btn primary" id="vInv">Attach invoice</button>` : ''}
      ${e.remindAt ? `<a class="btn" href="${calUrl(e)}" target="_blank" rel="noopener">Add to Google Calendar</a>` : ''}
      <button class="btn" id="vNew">Check something else</button>
    </div>
    <p class="meta" id="vInvStatus"></p>
  </div>`;
  $('#vNew').onclick = () => renderStart();
  if ($('#vInv')) $('#vInv').onclick = () => pickInvoice(e.id, () => {
    const cur = entries.find(x => x.id === e.id);
    $('#vInvStatus').textContent = cur?.invoice ? `Attached: ${cur.invoice.name}` : '';
    $('#vInv').textContent = 'Replace invoice';
  });
}

// ================= Reminders =================
function renderDue() {
  const due = entries.filter(e => e.remindAt && !e.reminderDone && e.remindAt <= Date.now());
  $('#dueBox').innerHTML = due.length ? `<div class="card due">
    <div class="sub" style="color:var(--wait);font-weight:600">Time to check back</div>
    ${due.map(e => `<div class="entry"><div class="top"><span class="name">${esc(e.item)}</span>
      <span class="meta">due ${fmtDate(e.remindAt)}</span></div>
      <div class="btns"><button class="btn small primary" data-re="${e.id}">Re-check now</button>
      <button class="btn small" data-dis="${e.id}">I don’t want it anymore</button></div></div>`).join('')}
  </div>` : '';
  $('#dueBox').querySelectorAll('[data-re]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.re); renderStart(e.item, e.price ?? '', e.id);
  });
  $('#dueBox').querySelectorAll('[data-dis]').forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.dis);
    e.reminderDone = true; e.dismissed = true; persist(e); renderDue(); toast(`Let go of ${e.item}`);
  });
}

// ================= Invoices =================
let pickCb = null, pickId = null;
function pickInvoice(id, cb) { pickId = id; pickCb = cb; $('#fileInput').value = ''; $('#fileInput').click(); }
$('#fileInput').onchange = async () => {
  const f = $('#fileInput').files[0]; const e = entries.find(x => x.id === pickId);
  if (!f || !e) return;
  toast('Uploading invoice…');
  try {
    const old = e.invoice;
    if (assets) {
      const r = await assets.upload(f);
      e.invoice = { assetId: r.id, name: f.name, type: f.type, size: f.size, addedAt: Date.now() };
      if (old?.assetId) assets.delete(old.assetId).catch(() => {});
    } else {
      await idbDo('readwrite', s => s.put(f, e.id));
      e.invoice = { local: true, name: f.name, type: f.type, size: f.size, addedAt: Date.now() };
    }
    persist(e); toast('Invoice attached'); pickCb && pickCb(); renderHistory();
  } catch (err) { toast('Could not attach invoice: ' + (err.message || err.code || 'unknown error')); }
};
const blobUrls = {};
async function invoiceUrl(e) {
  if (e.invoice.assetId) return '/_blob/' + e.invoice.assetId;
  if (blobUrls[e.id]) return blobUrls[e.id];
  const b = await idbDo('readonly', s => s.get(e.id)).catch(() => null);
  return b ? (blobUrls[e.id] = URL.createObjectURL(b)) : null;
}

// ================= History =================
let pendingDelete = null;
function renderHistory() {
  const sum = a => a.reduce((s, e) => s + (Number(e.price) || 0), 0);
  const dont = entries.filter(e => e.verdict === 'dont'), buy = entries.filter(e => e.verdict === 'buy');
  const waiting = entries.filter(e => e.verdict === 'wait' && !e.reminderDone);
  const saved = sum(dont);
  $('#stats').innerHTML = `
    <div class="stat"><b>${entries.length}</b><span>decisions</span></div>
    <div class="stat"><b>${saved ? money(saved) : dont.length}</b><span>${saved ? `not spent · ${dont.length} items` : 'talked out of'}</span></div>
    <div class="stat"><b>${buy.length}</b><span>bought${waiting.length ? ` · ${waiting.length} waiting` : ''}</span></div>`;

  const q = $('#search').value.trim().toLowerCase(), f = $('#filter').value;
  const list = entries.filter(e => (!f || e.verdict === f) && (!q || e.item.toLowerCase().includes(q)));
  if (!list.length) { $('#list').innerHTML = `<div class="empty">${entries.length ? 'Nothing matches.' : 'No decisions yet. Your first one will show up here.'}</div>`; return; }

  $('#list').innerHTML = list.map(e => {
    let status = '';
    if (e.remindAt) status = e.dismissed ? ' · let go' : e.reminderDone ? ' · re-checked' :
      (e.remindAt <= Date.now() ? ' · <b style="color:var(--wait)">check-in due</b>' : ` · check ${fmtDate(e.remindAt)}`);
    const isImg = e.invoice && /^image\//.test(e.invoice.type);
    return `<div class="entry">
      <div class="top"><span class="name">${esc(e.item)}</span><span class="tag ${e.verdict}">${LABEL[e.verdict]}</span></div>
      <div class="meta">${fmtDate(e.createdAt)}${e.price != null ? ' · ' + money(e.price) : ''}${status}${e.recheckOf ? ' · re-check' : ''}</div>
      <details><summary class="meta" style="cursor:pointer">How you decided</summary>
        <ol class="path">${(e.path || []).map(p => `<li>${esc(p.q)} <b>${esc(p.a)}</b></li>`).join('')}</ol>
        <div class="meta" style="padding-left:18px">→ ${esc(e.why)}</div>
      </details>
      ${e.invoice ? `<div class="btns"><span class="invoice">Invoice: <a data-inv-link="${e.id}" target="_blank" rel="noopener">${esc(e.invoice.name)}</a></span></div>
        ${isImg ? `<img class="thumb" data-inv-img="${e.id}" alt="Invoice for ${esc(e.item)}">` : ''}` : ''}
      <div class="btns">
        ${e.verdict === 'buy' ? `<button class="btn small" data-inv="${e.id}">${e.invoice ? 'Replace invoice' : 'Attach invoice'}</button>` : ''}
        ${e.remindAt && !e.reminderDone ? `<a class="btn small" href="${calUrl(e)}" target="_blank" rel="noopener">Add to calendar</a>` : ''}
        ${pendingDelete === e.id
          ? `<button class="btn small danger" data-del-yes="${e.id}">Delete for good</button><button class="btn small link" data-del-no>Cancel</button>`
          : `<button class="btn small link" data-del="${e.id}">Delete</button>`}
      </div>
    </div>`;
  }).join('');

  const by = id => entries.find(x => x.id === id);
  $('#list').querySelectorAll('[data-inv-link]').forEach(async a => { const u = await invoiceUrl(by(a.dataset.invLink)); if (u) a.href = u; });
  $('#list').querySelectorAll('[data-inv-img]').forEach(async i => { const u = await invoiceUrl(by(i.dataset.invImg)); if (u) i.src = u; });
  $('#list').querySelectorAll('[data-inv]').forEach(b => b.onclick = () => pickInvoice(b.dataset.inv));
  $('#list').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { pendingDelete = b.dataset.del; renderHistory(); });
  $('#list').querySelectorAll('[data-del-no]').forEach(b => b.onclick = () => { pendingDelete = null; renderHistory(); });
  $('#list').querySelectorAll('[data-del-yes]').forEach(b => b.onclick = () => {
    const e = by(b.dataset.delYes); pendingDelete = null;
    if (e.invoice?.assetId && assets) assets.delete(e.invoice.assetId).catch(() => {});
    if (e.invoice?.local) idbDo('readwrite', s => s.delete(e.id)).catch(() => {});
    removeEntry(e); renderHistory(); renderDue(); toast(`Deleted ${e.item}`);
  });
}
$('#search').oninput = renderHistory;
$('#filter').onchange = renderHistory;
$('#exportBtn').onclick = async () => {
  try { await downloads.save({ filename: 'to-buy-or-not-history.json', data: JSON.stringify(entries, null, 2) }); toast('Exported'); }
  catch (err) { if (err?.code !== 'declined') toast('Export not available here'); }
};

// ================= Tabs =================
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  $('#decide').hidden = b.dataset.tab !== 'decide';
  $('#history').hidden = b.dataset.tab !== 'history';
  if (b.dataset.tab === 'history') renderHistory(); else renderDue();
});

renderDue();
renderStart();
connect();
</script>
